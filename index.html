<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Launch</title>

  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: #ffffff;
    }

    #ios-ar-link {
      display: none;
    }
  </style>
</head>

<body>

<!-- iPhone用：今まで通り -->
<a id="ios-ar-link" rel="ar" href="./models/nekolion_0819_colorOK.usdz">
  <img src="https://dummyimage.com/1x1/fff/fff" alt="AR">
</a>

<div id="android-container"></div>

<script>
window.onload = function() {

  const ua = navigator.userAgent.toLowerCase();

  const isIOS = /iphone|ipad|ipod/.test(ua);
  const isAndroid = /android/.test(ua);

  if (isIOS) {

    // iPhone → Quick Look
    document.getElementById("ios-ar-link").click();

  } else if (isAndroid) {

    // Android → model-viewer / WebXR
    document.getElementById("android-container").innerHTML = `
      <model-viewer
        src="https://skymchhr.github.io/ar-test-0508/models/nekolion_0819_AR_1m_centered.glb"
        ar
        ar-modes="webxr scene-viewer"
        ar-scale="fixed"
        camera-controls
        camera-orbit="0deg 75deg 4m"
        camera-target="0m 0.8m 0m"
        field-of-view="30deg"
        autoplay>
        
        <button
          slot="ar-button"
          style="
            position:absolute;
            left:50%;
            bottom:40px;
            transform:translateX(-50%);
            padding:14px 24px;
            font-size:16px;
          ">
          ARで見る
        </button>

      </model-viewer>
    `;

  } else {

    document.body.innerHTML =
      "<p>スマートフォンで開いてください。</p>";

  }

}
</script>

</body>
</html>
