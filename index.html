<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Test</title>

  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background: #ddd;
    }
  </style>
</head>

<body>

  <model-viewer
    src="https://skymchhr.github.io/ar-test-0508/models/ARnekolion_fix_0819_rere.glb"
    ar
    ar-modes="webxr scene-viewer"
    ar-scale="fixed"
    camera-controls
    autoplay>

    <button
      slot="ar-button"
      style="
        position:absolute;
        left:50%;
        bottom:40px;
        transform:translateX(-50%);
        padding:14px 24px;
        font-size:16px;
      ">
      ARで見る
    </button>

  </model-viewer>

</body>
</html>
