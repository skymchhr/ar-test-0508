<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>AR Viewer</title>

  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
  </script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    model-viewer {
      width: 100%;
      height: 100dvh;
      background: transparent;
    }

    #ar-button {
      position: absolute;
      left: 50%;
      bottom: calc(30px + env(safe-area-inset-bottom));
      transform: translateX(-50%);

      padding: 14px 28px;
      border: 0;
      border-radius: 999px;

      background: #fff;
      color: #111;

      font-size: 16px;
      font-weight: 700;

      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);

      z-index: 10;
    }
  </style>
</head>

<body>

  <model-viewer
    src="https://skymchhr.github.io/ar-test-0508/models/ARnekolion_fix_0819_rere.glb"

    ios-src="https://skymchhr.github.io/ar-test-0508/models/nekolion_0819_colorOK.usdz"

    alt="ARモデル"

    ar
    ar-modes="webxr scene-viewer quick-look"

    ar-placement="floor"
    ar-scale="fixed"

    camera-controls

    autoplay>

    <button
      slot="ar-button"
      id="ar-button">
      ARで見る
    </button>

  </model-viewer>

</body>
</html>
